<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaos Party!</title>
<style>
:root{--bg:#d8cfbf;--fg:#2b2118;--card:#efe7d8;--ac:#e8590c;--line:#c4b69c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a16;--fg:#f6ead8;--card:#2c261f;--line:#4a4036}}
:root[data-theme="dark"]{--bg:#1e1a16;--fg:#f6ead8;--card:#2c261f;--line:#4a4036}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1800px;margin:0 auto;padding:16px}
h1{margin:0 0 4px;font-size:28px}h2{margin:8px 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
button{font:inherit;font-weight:700;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 18px;cursor:pointer}
button:disabled{opacity:.4}
input{font:inherit;padding:11px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:60%}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.t{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:2px solid var(--line);position:relative}
.tp{background:#d3f9d8;color:#1b5e20}.tm{background:#ffe0e0;color:#8a1c1c}.ts{background:#e5dbff;color:#3b2a7a}.tb{background:#fff3bf;color:#7a5a00}.tn{background:var(--card)}
.d{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:12px}
.d i,.pl i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid #0006}
.pl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin:4px 0}
.pl b{margin-left:auto}.pl.on{background:var(--ac);color:#fff}
#big{width:100%;font-size:64px;padding:40px}
#rf{height:240px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;background:#c92a2a;color:#fff;user-select:none}
#ar{position:relative;height:300px;border-radius:16px;border:2px dashed var(--line);overflow:hidden}
#tg{position:absolute;width:84px;height:84px;border-radius:50%;padding:0;font-size:42px}
.muted{opacity:.7;font-size:14px}.hide{display:none}
#set,#tabp{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:#0008;padding:16px}
#set.hide,#tabp.hide{display:none}#set .card,#tabp .card{min-width:260px;max-width:420px;width:100%}
#set input{width:auto;padding:0}.fab{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:8;display:flex;gap:6px}.fab button{padding:8px 12px}
.lay{display:grid;grid-template-columns:150px minmax(0,1fr) 190px;gap:12px;align-items:start}
@media(max-width:860px){.lay{grid-template-columns:1fr}}
.lay>div{min-width:0}
#act{text-align:center;margin-top:12px}#act button{font-size:22px;padding:18px 28px;margin:6px}#act h2{font-size:24px}
#tip{margin:0;min-height:48px;font-size:14px}
#iris{position:fixed;left:50%;top:50%;width:0;height:0;border-radius:50%;box-shadow:0 0 0 200vmax #000;transform:translate(-50%,-50%);z-index:9;animation:ir 2.8s ease-in forwards}
@keyframes ir{from{width:230vmax;height:230vmax}to{width:0;height:0}}
#dice{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);z-index:7;background:#fff;color:#2b2118;border:5px solid var(--ac);border-radius:24px;width:140px;height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:76px;font-weight:800;box-shadow:0 10px 40px #0007}
#dice small{font-size:14px;font-weight:700}#dice.sp{animation:sp .5s linear infinite}#dice.hide{display:none}
@keyframes sp{to{transform:translate(-50%,-50%) rotate(360deg)}}
.alt{background:#6c757d!important;font-size:15px!important;padding:10px 16px!important}
g[data-i]{cursor:pointer}g[data-i]:hover ellipse{stroke:#fff;stroke-width:7;filter:brightness(1.15)}
#res{position:fixed;inset:0;z-index:8;background:radial-gradient(circle at 50% 40%,#1d2d1d,#05080a 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;text-align:center;padding:12px}
#res.hide{display:none}.rt{font-size:clamp(28px,6vw,64px);font-weight:900;color:#ffd43b;text-shadow:0 4px 0 #8a6d00,0 8px 20px #000}
.rk{font-size:30px;font-weight:900;color:#ffd43b}.rn{font-weight:800;font-size:16px;word-break:break-word}.rs{font-size:18px;opacity:.9}
.rr{font-size:15px;min-height:26px;border-top:3px solid #ffd43b88;margin-top:6px;padding-top:4px}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);z-index:8;background:#000d;color:#fff;padding:14px 22px;border-radius:14px;font-size:20px;font-weight:700;max-width:90vw;text-align:center}
#toast.hide{display:none}
#adm{position:fixed;left:8px;bottom:8px;z-index:8;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:10px;max-width:92vw;line-height:2.2}
#adm.hide{display:none}#adm select{font:inherit;padding:6px;max-width:55vw}

  const me=meId(),ps=S.ph==="lobby"?peers().filter(x=>x.presence.name).map(x=>({n:x.presence.name,col:x.presence.col||0,id:x.peer})):(S.ps||[]);
  $("#tabc").innerHTML="<h2>👥 Oyuncular</h2>"+(ps.map(p=>`<div class="pl"><i style="background:${col(p.col)}"></i>${esc(p.n)}${p.id===me?" (sen)":""}<b>${p.c!=null?p.c+" 🪙":""}${p.id===me&&p.h!=null?` · ❤️${p.h} 🔑${p.k}`:""}</b></div>`).join("")||"Kimse yok");
  p.classList.remove("hide");
}
const setTog=on=>$("#set").classList.toggle("hide",on===undefined?undefined:!on);
addEventListener("keydown",e=>{
  if(e.key==="Tab"&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||"")){e.preventDefault();tabShow(true)}
  if(e.key==="Escape")setTog();
});
addEventListener("keyup",e=>{if(e.key==="Tab")tabShow(false)});
addEventListener("keydown",e=>{
  const k=e.key.toLowerCase(),inp=/INPUT|TEXTAREA/.test((e.target||{}).tagName||"");
  if(!inp)held[k]=true;
  if(!inp&&k==="m"&&S.ph==="board")toggleFree();
  if(FREE&&!inp&&k.startsWith("arrow"))e.preventDefault();
  if(FREE&&!inp&&!V.on){
    const dx=(k==="d"||k==="arrowright"?1:0)-(k==="a"||k==="arrowleft"?1:0),dz=(k==="s"||k==="arrowdown"?1:0)-(k==="w"||k==="arrowup"?1:0);
    if(dx||dz){const mw=$("#mw");if(mw)mw.scrollBy(dx*120,dz*120)}
  }
});
addEventListener("keyup",e=>{held[e.key.toLowerCase()]=false});
$("#am").innerHTML=GN.map((n,i)=>`<option value="${i}">${n}</option>`).join("");
$("#fa").onclick=()=>$("#adm").classList.toggle("hide");
$("#agb").onclick=()=>admEmit("go",{i:+$("#ag").value});
$("#agm").onclick=()=>{admGo=!admGo;$("#agm").textContent=admGo?"✅ Şimdi bir kareye tıkla":"🖱️ Haritadan seç"};
$("#amb").onclick=()=>admEmit("mini",{g:+$("#am").value});
$("#ak").onclick=()=>admEmit("key",{});
$("#tabp").onclick=()=>tabShow(false);
$("#ff").onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
$("#fp").onclick=()=>$("#tabp").classList.contains("hide")?tabShow(true):tabShow(false);
$("#fs").onclick=()=>setTog();$("#sx").onclick=()=>setTog(false);$("#ver").textContent="Chaos Party! sürüm "+VER;$("#upd").innerHTML=`<h3>🆕 Güncelleme ${VER}</h3><ul style="padding-left:20px;margin:0">${CHG.map(x=>"<li>"+x+"</li>").join("")}</ul>`;
$("#tp").onclick=()=>{wallet+=200;save();shop()};
$("#set").onclick=e=>{if(e.target.id==="set")setTog(false)};
$("#bgc").oninput=e=>{bg=e.target.value;applyBg();save()};
$("#bgr").onclick=()=>{bg=null;applyBg();save()};
$("#mus").checked=musOn;$("#v3c").checked=v3;if(!window.THREE)$("#v3c").disabled=true;
$("#v3c").onchange=e=>{v3=e.target.checked;save();if(S.ph!=="lobby")render()};$("#vol").value=Math.round(vol*100);if(bg)$("#bgc").value=bg;applyBg();
$("#mus").onchange=e=>{musOn=e.target.checked;save();audio()};
$("#vol").oninput=e=>{vol=e.target.value/100;if(MG)MG.gain.value=vol*.4;save()};
$("#jn").onclick=()=>{const p=pres();if(!p.name||!R)return;named=true;R.presence(p);$("#jn").textContent="Güncelle";lobby()};
const gen=()=>[...Array(4)].map(()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
$("#mk").onclick=()=>{code=gen();creator=true;render()};
$("#mkb").onclick=()=>{$("#shop2").classList.toggle("hide");shop()};
$("#jo").onclick=()=>$("#jbox").classList.toggle("hide");
$("#cg").onclick=()=>{const c=$("#cd").value.trim().toUpperCase();if(c.length!==4){$("#cerr").textContent="Kod 4 karakter olmalı.";return}code=c;creator=false;render()};
$("#bk").onclick=()=>{code="";creator=false;named=false;if(R)R.presence({});$("#jn").textContent="Katıl";render()};
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{selMap=+b.dataset.m;lobby()});
$("#st").onclick=()=>{if(isHost())startGame()};
(async()=>{
  R=window.claude&&claude.use?await claude.use("room"):await connectWS();
  if(!R){$("#off").classList.remove("hide");$("#jn").disabled=true;return}
  R.on("state",m=>{const d=m.data||{};if(!code||d.c!==code||(m.isMe&&m.sameTab))return;S=d.S;render()});
  R.on("act",handle);R.on("act",m=>{const d=m.data||{};if(MPH&&d.c===code&&(d.t==="mp"||d.t==="hit"))MPH(m.peer,d)});
  R.onPeers(c=>{if(isHost()&&S.ph!=="lobby"&&c.joined.length)push();if(S.ph==="lobby")lobby()});
  setInterval(()=>{if(isHost()&&S.ph!=="lobby")emitS()},4000);
  render();
})();
</script></body></html>
